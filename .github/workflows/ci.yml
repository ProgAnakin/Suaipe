name: CI

on:
  push:
    branches: [main, "claude/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Edge contracts
        run: npm run typecheck:edge

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        # Fails only on a high/critical advisory in runtime deps. Dev-only
        # advisories don't ship to users, so they don't block the build.
        run: npm audit --omit=dev --audit-level=high

      - name: Database security regression
        run: bash supabase/tests/run-local.sh

      - name: Synthetic backup restoration
        run: npm run test:restore

      - name: Test
        run: npm test

      - name: Build
        env:
          # Provide stub env vars so Vite doesn't throw at build time.
          # Real secrets are only set in Vercel / Supabase — never here.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run the iPad project's WebKit suite on every PR; keep assertions enabled.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The only Playwright project is "ipad-landscape" (iPad Pro 11), which
        # runs on WebKit — the engine real iPad kiosks use. Installing chromium
        # here (as it was) meant the suite could never launch its browser in CI.
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run isolated demo E2E
        run: npm run test:e2e:demo

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned scanners
        run: |
          bash scripts/install-gitleaks.sh "${{ runner.temp }}/gitleaks"
          python -m pip install semgrep==1.184.0
      - name: Scan Git history (redacted)
        run: '"${{ runner.temp }}/gitleaks/gitleaks" git . --log-opts=--all --redact=100 --no-banner'
      - name: Scan production source
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_SETTINGS_FILE: ${{ runner.temp }}/semgrep-settings.yml
          SEMGREP_LOG_FILE: ${{ runner.temp }}/semgrep.log
        run: semgrep scan --metrics=off --disable-version-check --config config/semgrep.yml --error .
