name: CI

on:
  push:
    branches: [main, "claude/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        # Fails only on a high/critical advisory in runtime deps. Dev-only
        # advisories don't ship to users, so they don't block the build.
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        env:
          # Provide stub env vars so Vite doesn't throw at build time.
          # Real secrets are only set in Vercel / Supabase — never here.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required check — a red Playwright run blocks the PR. The earlier failures
    # were a wrong browser install (chromium instead of the iPad project's
    # WebKit), now fixed; the suite is green (8/8).

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The only Playwright project is "ipad-landscape" (iPad Pro 11), which
        # runs on WebKit — the engine real iPad kiosks use. Installing chromium
        # here (as it was) meant the suite could never launch its browser in CI.
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-resilience:
    name: Kiosk resilience (real app, misbehaving backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory until it has been green on WebKit for a while: ~40 scenarios that drive the whole
    # kiosk against an in-memory backend that drops connections, loses responses and hangs.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run the resilience suite
        run: npx playwright test --project=resilience --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-resilience-report
          path: playwright-report/
          if-no-files-found: ignore

  sql:
    name: SQL · migrations from zero + security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Apply every migration to an empty database and attack it as each role
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run.sh
